<!doctype html><!--pwa-->
<html lang="pt-BR"><!--pwa-->
<head><!--pwa-->
<meta charset="utf-8"><!--pwa-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--pwa-->
<link rel="manifest" href="manifest.webmanifest"><!--pwa-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--pwa-->
<meta name="theme-color" content="#0b6e4f"><!--pwa-->
<title>RodaLucro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: uma tela só, de cima para baixo: dia e meta → corridas → gastos → resumo (placa de rodovia) → dias anteriores. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --ink: #14201c;
  --muted: #5a6a65;
  --line: #d4ddd9;
  --sign: #0b6e4f;      /* verde das placas de rodovia */
  --sign-ink: #ffffff;
  --mark: #f2b705;      /* amarelo da faixa central */
  --asphalt: #2b3330;
  --good: #1a7f4b;
  --bad: #c0392b;
  --font-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #161f1c; --ink: #e5ede9; --muted: #93a39d; --line: #26332e;
    --sign: #0d7a58; --mark: #f5c430; --asphalt: #0a0e0d; --good: #3cc483; --bad: #ef6b5b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161f1c; --ink: #e5ede9; --muted: #93a39d; --line: #26332e;
  --sign: #0d7a58; --mark: #f5c430; --asphalt: #0a0e0d; --good: #3cc483; --bad: #ef6b5b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
main {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 28px; height: 28px; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 .num { font-size: 1rem; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 0.88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label, .flabel { font-size: 0.85rem; font-weight: 600; }
input, select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; min-width: 0;
}
input.big-in { font-family: var(--font-num); font-size: 1.5rem; font-weight: 700; padding: 10px 12px; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--mark); outline-offset: 1px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 12px 14px; font-weight: 700; }
button.primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
button.x { padding: 4px 10px; font-size: 1.1rem; line-height: 1; color: var(--muted); background: transparent; border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border-radius: 999px; padding: 9px 16px; }
.chips button[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.add.three { grid-template-columns: minmax(0, 1fr) auto; }
.add.three .field:first-child { grid-column: 1 / -1; }
.add button { height: 50px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .what { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.list .n { color: var(--muted); font-size: 0.8rem; width: 1.6rem; }
.list .amt { font-weight: 700; }
.chip { font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.in { color: var(--good); }
.chip.out { color: var(--bad); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 4px 0; }

/* Resumo: placa de rodovia */
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 16px; padding: 6px; }
.sign-in { border: 2px solid var(--sign-ink); border-radius: 11px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sign h2 { color: var(--sign-ink); }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 1rem; }
.sum .num { text-align: right; }
.sum .tot { font-weight: 800; font-size: 1.15rem; }
.sum .rule { grid-column: 1 / -1; border-top: 2px solid var(--sign-ink); margin-top: 2px; }
.road { position: relative; height: 20px; background: var(--asphalt); border-radius: 4px; overflow: hidden; }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 14px, transparent 14px 26px); }
.road i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--mark); z-index: 1; transition: width .4s ease; }
.verdict { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; line-height: 1.2; text-wrap: balance; }
.verdict small { display: block; font-weight: 400; font-size: 0.9rem; opacity: .92; margin-top: 2px; }
.share { display: flex; align-items: center; justify-content: center; text-decoration: none; background: var(--sign-ink); color: var(--sign); border-radius: 10px; padding: 12px; font-weight: 800; }

/* Dias anteriores */
.days li { cursor: pointer; }
.days .d { font-weight: 700; min-width: 5.5rem; text-transform: capitalize; }
.days .st { font-size: 0.82rem; color: var(--muted); flex: 1; min-width: 0; }
.days .st.ok { color: var(--good); font-weight: 700; }
.days li[aria-current="true"] .d { color: var(--sign); }
.days li[aria-current="true"] { background: color-mix(in srgb, var(--mark) 14%, transparent); }

footer { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: 0.85rem; color: var(--muted); padding-top: 8px; }
footer a { color: var(--ink); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; opacity: 0; transition: .25s; pointer-events: none; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head><!--pwa-->
<body><!--pwa-->
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="var(--sign)"/><rect x="4" y="4" width="24" height="24" rx="4" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M16 8v4M16 15v3M16 21v3" stroke="var(--mark)" stroke-width="2.6" stroke-linecap="round"/></svg>
      RodaLucro
    </div>
    <button type="button" id="btn-today" hidden>Voltar para hoje</button>
  </header>

  <!-- 1. Dia e meta -->
  <section class="card">
    <div class="row">
      <div class="field"><label for="f-data">Data</label><input id="f-data" type="date"></div>
      <div class="field"><label for="f-meta">Meta do dia (R$)</label><input id="f-meta" class="big-in" inputmode="decimal" placeholder="300"></div>
    </div>
  </section>

  <!-- 2. Corridas -->
  <section class="card">
    <h2>Corridas <span class="num" id="c-total">R$ 0,00</span></h2>
    <div class="field"><span class="flabel">App</span><div class="chips" id="c-apps" role="group" aria-label="App da corrida"></div></div>
    <form class="add" id="f-corrida" autocomplete="off">
      <div class="field"><label for="c-valor">Valor da corrida (R$)</label><input id="c-valor" class="big-in" inputmode="decimal" placeholder="0,00"></div>
      <button type="submit" class="primary">+ Adicionar</button>
    </form>
    <ul class="list" id="c-list"></ul>
  </section>

  <!-- 3. Gastos -->
  <section class="card">
    <h2>Gastos <span class="num" id="g-total">R$ 0,00</span></h2>
    <form class="add three" id="f-gasto" autocomplete="off">
      <div class="field"><label for="g-cat">O quê</label>
        <select id="g-cat"><option>Combustível</option><option>Café da manhã</option><option>Almoço</option><option>Lanche</option><option>Lavagem</option><option>Pedágio</option><option>Estacionamento</option><option>Manutenção</option><option>Outros</option></select></div>
      <div class="field"><label for="g-valor">Valor (R$)</label><input id="g-valor" inputmode="decimal" placeholder="0,00"></div>
      <button type="submit" class="primary">+ Adicionar</button>
    </form>
    <ul class="list" id="g-list"></ul>
  </section>

  <!-- 4. Resumo -->
  <section class="sign" aria-live="polite">
    <div class="sign-in">
      <h2 id="r-title">Resumo de hoje</h2>
      <div class="sum">
        <span>Ganhos (<span id="r-n">0</span> corridas)</span><span class="num" id="r-ganhos">R$ 0,00</span>
        <span>Gastos</span><span class="num" id="r-gastos">R$ 0,00</span>
        <span class="rule" aria-hidden="true"></span><span class="tot">Lucro</span><span class="num tot" id="r-lucro">R$ 0,00</span>
      </div>
      <div class="road" role="progressbar" aria-label="Progresso da meta" aria-valuemin="0" aria-valuemax="100" id="r-road"><i id="r-fill"></i></div>
      <div class="verdict" id="r-verdict"></div>
      <a class="share" id="r-share" href="#" target="_blank" rel="noopener">Enviar resumo no WhatsApp</a>
    </div>
  </section>

  <!-- 5. Dias anteriores -->
  <section class="card">
    <h2>Seus dias</h2>
    <ul class="list days" id="d-list"></ul>
  </section>

  <footer>
    <span>Os dados ficam salvos neste celular.</span>
    <a href="completo.html">Versão completa: relatórios, combustível, manutenção →</a>
    <a href="planos.html">Planos</a>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // Mesmo armazenamento da versão completa (completo.html): os dados aparecem nas duas.
  const KEY = 'rodalucro:v1';
  const APPS = ['Uber', '99', 'inDrive', 'Outro'];
  const $ = (id) => document.getElementById(id);

  const brl = (n) => (Number.isFinite(n) ? n : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const brl0 = (n) => (Number.isFinite(n) ? n : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const dec = (n, d = 2) => (Number.isFinite(n) ? n : 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
  function num(v) {
    let s = String(v == null ? '' : v).trim().replace(/[R$\s]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    return parseFloat(s);
  }
  const dayKey = (d) => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  const niceDate = (k, opt) => new Date(k + 'T12:00').toLocaleDateString('pt-BR', opt || { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- dados ----------
  let state;
  function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  state = load() || {};
  if (state.sample) state = { settings: state.settings }; // exemplo da versão completa não entra aqui
  state.settings = state.settings || {};
  state.entries = state.entries || [];
  state.plans = state.plans || {};
  state.onboarded = true;

  let day = dayKey();
  const FUEL = 'Combustível';
  const listOf = (k) => state.entries.filter((e) => e.date === k);
  const metaOf = (k) => { const p = state.plans[k]; return p && p.meta > 0 ? p.meta : (state.settings.meta || 0); };
  function stats(k) {
    const l = listOf(k);
    const corridas = l.filter((e) => e.type === 'ganho');
    const gastos = l.filter((e) => e.type === 'gasto' || e.type === 'abast');
    const ganhos = corridas.reduce((s, e) => s + e.valor, 0), g = gastos.reduce((s, e) => s + e.valor, 0);
    const n = corridas.reduce((s, e) => s + (e.corridas || 1), 0);
    return { corridas, gastos, ganhos, g, n, lucro: ganhos - g, meta: metaOf(k) };
  }
  // ticket médio de todas as corridas (para estimar quantas faltam)
  function ticket() {
    let v = 0, n = 0;
    state.entries.forEach((e) => { if (e.type === 'ganho') { v += e.valor; n += e.corridas || 1; } });
    return n >= 3 ? v / n : 18;
  }

  // ---------- tela ----------
  function render() {
    const today = dayKey(), t = stats(day);
    $('btn-today').hidden = day === today;
    $('f-data').value = day;
    if (document.activeElement !== $('f-meta')) $('f-meta').value = t.meta ? dec(t.meta) : '';

    const app = state.settings.ultimoApp && APPS.includes(state.settings.ultimoApp) ? state.settings.ultimoApp : 'Uber';
    $('c-apps').innerHTML = APPS.map((a) => '<button type="button" data-app="' + a + '" aria-pressed="' + (a === app) + '">' + a + '</button>').join('');

    $('c-total').textContent = brl(t.ganhos);
    $('c-list').innerHTML = t.corridas.length
      ? t.corridas.map((e, i) => '<li><span class="what"><span class="n">' + (i + 1) + 'ª</span><span class="chip in">' + esc(e.app) + '</span>' + ((e.corridas || 1) > 1 ? '<span class="muted">' + e.corridas + ' corridas</span>' : '') + '</span><span class="amt num">' + brl(e.valor) + '</span><button type="button" class="x" data-del="' + e.id + '" aria-label="Apagar corrida">×</button></li>').join('')
      : '<li class="empty">Nenhuma corrida ainda. Escolha o app, digite o valor e toque em Adicionar.</li>';

    $('g-total').textContent = brl(t.g);
    $('g-list').innerHTML = t.gastos.length
      ? t.gastos.map((e) => '<li><span class="what"><span class="chip out">' + esc(e.type === 'abast' ? FUEL : (e.nota && e.cat === 'Alimentação' ? e.nota : e.cat)) + '</span></span><span class="amt num">−' + brl(e.valor) + '</span><button type="button" class="x" data-del="' + e.id + '" aria-label="Apagar gasto">×</button></li>').join('')
      : '<li class="empty">Nenhum gasto. Combustível, café, almoço… entram aqui.</li>';

    // resumo
    $('r-title').textContent = day === today ? 'Resumo de hoje' : 'Resumo de ' + niceDate(day, { weekday: 'long', day: '2-digit', month: '2-digit' });
    $('r-n').textContent = t.n;
    $('r-ganhos').textContent = brl(t.ganhos);
    $('r-gastos').textContent = '−' + brl(t.g);
    $('r-lucro').textContent = brl(t.lucro);
    const p = t.meta > 0 ? Math.max(0, Math.min(100, (t.lucro / t.meta) * 100)) : 0;
    $('r-fill').style.width = p + '%'; $('r-road').setAttribute('aria-valuenow', Math.round(p));
    let v;
    if (!(t.meta > 0)) v = 'Coloque a meta do dia<small>lá em cima, para saber quanto falta.</small>';
    else if (t.lucro >= t.meta) v = '✅ Bateu a meta!<small>Lucro de ' + brl(t.lucro) + (t.lucro > t.meta ? ', ' + brl(t.lucro - t.meta) + ' acima da meta de ' + brl0(t.meta) : '') + '.</small>';
    else {
      const falta = t.meta - t.lucro, n = Math.ceil(falta / ticket());
      v = (day === today ? 'Faltam ' : 'Faltou ') + brl(falta) + '<small>para a meta de ' + brl0(t.meta) + (day === today ? ' · ≈ ' + n + ' corrida' + (n > 1 ? 's' : '') + ' de ' + brl0(ticket()) : '') + '</small>';
    }
    $('r-verdict').innerHTML = v;
    $('r-share').href = 'https://wa.me/?text=' + encodeURIComponent(shareText(t));

    // dias anteriores
    const keys = [...new Set(state.entries.map((e) => e.date).concat(Object.keys(state.plans)))].sort().reverse().slice(0, 60);
    if (!keys.includes(today)) keys.unshift(today);
    $('d-list').innerHTML = keys.map((k) => {
      const s = stats(k);
      const st = !s.corridas.length && !s.gastos.length ? '<span class="st">sem lançamentos</span>'
        : s.meta > 0 && s.lucro >= s.meta ? '<span class="st ok">✅ bateu a meta</span>'
        : s.meta > 0 ? '<span class="st">faltou ' + brl0(s.meta - s.lucro) + '</span>' : '<span class="st">sem meta</span>';
      return '<li data-day="' + k + '" tabindex="0" role="button"' + (k === day ? ' aria-current="true"' : '') + '><span class="d">' + (k === today ? 'Hoje' : niceDate(k)) + '</span>' + st + '<span class="amt num">' + brl(s.lucro) + '</span></li>';
    }).join('');
  }
  function shareText(t) {
    return ['🚗 *RodaLucro* · ' + niceDate(day),
      'Ganhos: ' + brl(t.ganhos) + ' (' + t.n + ' corridas)',
      'Gastos: ' + brl(t.g),
      '*Lucro: ' + brl(t.lucro) + '*',
      t.meta > 0 ? (t.lucro >= t.meta ? '✅ Bati a meta de ' + brl0(t.meta) + '!' : '🎯 Meta ' + brl0(t.meta) + ': ' + (day === dayKey() ? 'faltam ' : 'faltou ') + brl(t.meta - t.lucro)) : ''].filter(Boolean).join('\n');
  }

  let toastT;
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- ações ----------
  $('f-data').addEventListener('change', () => { if ($('f-data').value) { day = $('f-data').value; render(); } });
  $('btn-today').addEventListener('click', () => { day = dayKey(); render(); });
  $('f-meta').addEventListener('change', () => {
    const m = num($('f-meta').value);
    if (!(m > 0)) { toast('Digite a meta em reais, ex.: 300'); return; }
    state.plans[day] = { ...(state.plans[day] || { apps: [], costIds: [] }), meta: m };
    state.settings.meta = m; // vira a meta padrão dos próximos dias
    save(); render(); toast('Meta do dia: ' + brl0(m));
  });
  $('c-apps').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-app]'); if (!b) return;
    state.settings.ultimoApp = b.dataset.app; save();
    $('c-apps').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
  $('f-corrida').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const v = num($('c-valor').value);
    if (!(v > 0)) { toast('Digite o valor da corrida'); $('c-valor').focus(); return; }
    const app = ($('c-apps').querySelector('[aria-pressed="true"]') || {}).dataset?.app || 'Uber';
    state.entries.push({ id: uid(), date: day, type: 'ganho', app, valor: v, corridas: 1, km: 0, horas: 0 });
    save(); $('c-valor').value = ''; render(); $('c-valor').focus();
    const t = stats(day);
    toast('Corrida ' + t.n + ' · ' + brl(v) + (t.meta > 0 ? (t.lucro >= t.meta ? ' · meta batida! 🎉' : ' · faltam ' + brl0(t.meta - t.lucro)) : ''));
  });
  $('f-gasto').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const v = num($('g-valor').value), cat = $('g-cat').value;
    if (!(v > 0)) { toast('Digite o valor do gasto'); $('g-valor').focus(); return; }
    // grava no mesmo formato da versão completa
    if (cat === FUEL) state.entries.push({ id: uid(), date: day, type: 'abast', valor: v, litros: null, odo: null });
    else if (['Café da manhã', 'Almoço', 'Lanche'].includes(cat)) state.entries.push({ id: uid(), date: day, type: 'gasto', cat: 'Alimentação', valor: v, nota: cat });
    else state.entries.push({ id: uid(), date: day, type: 'gasto', cat, valor: v, nota: '' });
    save(); $('g-valor').value = ''; render(); toast(cat + ' · ' + brl(v));
  });
  document.addEventListener('click', (ev) => {
    const del = ev.target.closest('[data-del]');
    if (del) { state.entries = state.entries.filter((e) => e.id !== del.dataset.del); save(); render(); toast('Apagado'); return; }
    const d = ev.target.closest('[data-day]');
    if (d) { day = d.dataset.day; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  $('d-list').addEventListener('keydown', (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset.day) { ev.preventDefault(); ev.target.click(); } });

  save();
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.endsWith('github.io')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
